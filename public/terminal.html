<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal · TimosAI</title>
  <meta name="description" content="TimosAI Pro Terminal: izleme listesi, büyük grafik, order book derinliği, vadeli durum, long/short ve arz özeti.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script>try { localStorage.setItem("tms-mode", "pro"); } catch (e) {}</script>
</head>
<body class="term-page">
<main id="main" tabindex="-1" class="term-main">
  <h1 class="visually-hidden">Pro Terminal</h1>
  <div class="term-grid">
    <section class="card term-watch" aria-labelledby="tw-h">
      <div class="card-head"><h2 id="tw-h">İzleme listesi</h2><span class="kpi-small" id="tw-info"></span></div>
      <div class="tw-tools">
        <input type="search" id="tc-search" placeholder="Ara ( / )" aria-label="İzleme listesinde ara" autocomplete="off">
        <select id="tw-sort" aria-label="Sırala"><option value="opp">Fırsat</option><option value="chg">24 sa değişim</option><option value="vol">Hacim</option><option value="az">A → Z</option></select>
      </div>
      <div class="table-wrap tw-scroll"><table class="dense"><thead><tr><th>Coin</th><th class="num">Fiyat</th><th class="num">24 sa</th><th class="num">Long%</th></tr></thead><tbody id="tw-body"></tbody></table></div>
    </section>
    <div class="term-center">
      <section class="card term-chart" aria-labelledby="tc-h">
        <div class="card-head"><h2 id="tc-h"><span id="tc-sym">-</span> <span class="kpi-small" id="tc-px"></span></h2><span class="pill" id="tc-dec"></span></div>
        <div id="tc-chart"></div>
      </section>
      <section class="card term-bottom" aria-labelledby="tb-h">
        <h2 id="tb-h" class="visually-hidden">Hesap ve kayıtlar</h2>
        <div class="tabs" role="tablist" aria-label="Alt paneller">
          <button role="tab" aria-selected="true" data-tb="pos">Pozisyonlar</button>
          <button role="tab" aria-selected="false" data-tb="hist">Emir defteri</button>
          <button role="tab" aria-selected="false" data-tb="stats">Paper istatistik</button>
          <button role="tab" aria-selected="false" data-tb="bt">Backtest</button>
          <button role="tab" aria-selected="false" data-tb="sec">Güvenlik taraması</button>
          <button role="tab" aria-selected="false" data-tb="atk">ATK günlüğü</button>
        </div>
        <div id="tb-box" class="tb-box" role="tabpanel"></div>
      </section>
    </div>
    <aside class="term-side">
      <section class="card term-rtabs" aria-labelledby="rt-h">
        <h2 id="rt-h" class="visually-hidden">Piyasa ayrıntıları</h2>
        <div class="tabs" role="tablist" aria-label="Sağ paneller">
          <button role="tab" aria-selected="true" data-rt="ob">Order book</button>
          <button role="tab" aria-selected="false" data-rt="dv">Vadeli</button>
          <button role="tab" aria-selected="false" data-rt="ls">L/S</button>
          <button role="tab" aria-selected="false" data-rt="sp">Arz</button>
        </div>
        <div class="rt-box">
          <div data-rp="ob"><div class="kpi-small" id="ob-spread"></div><div id="ob-box" class="ob"></div></div>
          <div data-rp="dv" hidden><div id="dv-box"></div></div>
          <div data-rp="ls" hidden><div id="ls2-box"></div></div>
          <div data-rp="sp" hidden><div id="sp-box"></div></div>
        </div>
      </section>
      <section class="card term-setup" aria-labelledby="ts-h">
        <h2 id="ts-h" class="visually-hidden">Mentor işlemi özeti</h2>
        <div id="ts-box"><p class="kpi-small">Mentor işlemi hesaplanıyor…</p></div>
      </section>
    </aside>
  </div>
</main>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/js/common.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/supply.js"></script>
<script src="/js/longshort.js"></script>
<script src="/js/security.js"></script>
<script src="/js/plan.js"></script>
<script src="/js/terminal.js"></script>
</body>
</html>
