<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isı haritası · TimosAI</title>
  <meta name="description" content="İzleme listesindeki coinlerin ısı haritası: boyut hacim, renk değişim ya da fırsat/risk.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="main" tabindex="-1">
  <div class="page-head">
    <div>
      <h1>Isı haritası</h1>
      <p>Kutunun büyüklüğü 24 saatlik hacmi, rengi seçtiğin ölçüyü gösterir. Bir coine basınca ajanın görüşü ve skor bileşenleri açılır. Emirleri yalnızca ajan verir.</p>
    </div>
    <div id="detail-toggle"></div>
  </div>
  <div id="notices"></div>
  <div class="heat-controls">
    <div class="segment" role="group" aria-label="Renk ölçüsü">
      <button type="button" data-color="change" aria-pressed="true">24 sa değişim</button>
      <button type="button" data-color="score" aria-pressed="false">Fırsat / risk</button>
    </div>
    <div class="legend" id="legend"></div>
    <span class="kpi-small" id="hm-info" aria-live="polite"></span>
  </div>
  <div class="treemap" id="treemap" role="group" aria-label="Coin ısı haritası"></div>
  <div class="tm-tip" id="tm-tip" hidden></div>
</main>
<div id="drawer-root"></div>
<script src="/js/common.js"></script>
<script src="/js/heatmap.js"></script>
</body>
</html>
